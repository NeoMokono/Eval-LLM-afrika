[project]
name = "afrigemma-eval"
version = "0.1.0"
description = "Evaluation suite for AfriGemma: cached, reference-anchored benchmarking with Markdown + slide-data reports."
readme = "docs/EVAL_ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub==2.0.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
# Real inference and dataset loading. Not needed for planning, the mock backend or reports.
hf = [
    "accelerate==1.15.0",
    "datasets==5.0.1",
    "peft==0.21.2",
    "torch==2.14.1",
    "transformers==5.18.0",
]

[project.scripts]
afrigemma-eval = "cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval", "report"]
only-include = ["eval", "report", "cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "smoke: loads a tiny real model through the Transformers backend (needs the hf extra)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
